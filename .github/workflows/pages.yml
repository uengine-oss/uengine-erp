name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/build-sql.mjs
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      # The Docker bundle of the same commit goes beside the app, so the website's download link always serves the newest.
      - run: node scripts/build-docker-bundle.mjs --no-web
      - run: |
          cp dist-docker/uengine-erp-docker-*.zip web/dist/uengine-erp-docker.zip
          cd web/dist && sha256sum uengine-erp-docker.zip > uengine-erp-docker.zip.sha256
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
